<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="100%" height="100%">
  <defs>
    <radialGradient id="bunnyWhite4" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F5F3EF"/>
      <stop offset="100%" stop-color="#E5E0D5"/>
    </radialGradient>
    <filter id="flowerBunnyShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#4E3B27" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .bunny-flower-anim {
      animation: flowerBunnySway 3.2s ease-in-out infinite alternate;
      transform-origin: 100px 140px;
    }
    @keyframes flowerBunnySway {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg); }
    }
  </style>

  <g filter="url(#flowerBunnyShadow)">
    <!-- ================= BUNNY SITTING ================= -->
    <g class="bunny-flower-anim">
      <!-- Ears -->
      <ellipse cx="88" cy="48" rx="8" ry="25" transform="rotate(-15 88 48)" fill="url(#bunnyWhite4)"/>
      <ellipse cx="88" cy="48" rx="4.5" ry="17" transform="rotate(-15 88 48)" fill="#FDE8E4"/>
      <ellipse cx="118" cy="48" rx="8" ry="25" transform="rotate(10 118 48)" fill="url(#bunnyWhite4)"/>
      <ellipse cx="118" cy="48" rx="4.5" ry="17" transform="rotate(10 118 48)" fill="#FDE8E4"/>

      <!-- Body -->
      <ellipse cx="100" cy="145" rx="34" ry="40" fill="url(#bunnyWhite4)"/>
      <!-- Paws -->
      <ellipse cx="78" cy="182" rx="14" ry="9" fill="url(#bunnyWhite4)"/>
      <ellipse cx="116" cy="182" rx="14" ry="9" fill="url(#bunnyWhite4)"/>
      <ellipse cx="94" cy="140" rx="7" ry="10" transform="rotate(15 94 140)" fill="url(#bunnyWhite4)"/>

      <!-- Head -->
      <ellipse cx="102" cy="98" rx="34" ry="28" fill="url(#bunnyWhite4)"/>

      <!-- Nose & Mouth -->
      <polygon points="102,103 99,100 105,100" fill="#E89B9B"/>
      <path d="M 102 103 L 102 107" stroke="#423323" stroke-width="1.3"/>
      <path d="M 99 107 Q 102 110 105 107" fill="none" stroke="#423323" stroke-width="1.3"/>

      <!-- Eyes -->
      <circle cx="90" cy="94" r="3.4" fill="#2E241A"/>
      <circle cx="91.2" cy="92.8" r="1.1" fill="#FFFFFF"/>
      <circle cx="114" cy="94" r="3.4" fill="#2E241A"/>
      <circle cx="115.2" cy="92.8" r="1.1" fill="#FFFFFF"/>

      <!-- Blush -->
      <ellipse cx="83" cy="102" rx="5" ry="3" fill="#EFA094" opacity="0.6"/>
      <ellipse cx="121" cy="102" rx="5" ry="3" fill="#EFA094" opacity="0.6"/>
    </g>

    <!-- ================= PASTEL FLOWERS BESIDE BUNNY ================= -->
    <g transform="translate(145, 120)">
      <!-- Flower 1 (Pastel Pink Daisy) -->
      <g>
        <path d="M 0 45 Q 10 25 15 0" stroke="#7A9C74" stroke-width="3" fill="none"/>
        <path d="M 6 25 Q 18 20 22 28" stroke="#7A9C74" stroke-width="2.5" fill="none"/>
        <circle cx="15" cy="0" r="14" fill="#FDE4E4"/>
        <circle cx="15" cy="0" r="6" fill="#F2D179"/>
      </g>
      <!-- Flower 2 (Soft Yellow Daisy) -->
      <g transform="translate(30, 20)">
        <path d="M 0 35 Q 5 15 10 0" stroke="#7A9C74" stroke-width="2.5" fill="none"/>
        <circle cx="10" cy="0" r="11" fill="#FFF2CE"/>
        <circle cx="10" cy="0" r="4.5" fill="#E8A854"/>
      </g>
      <!-- Flower 3 (Pastel Baby Blue Bell) -->
      <g transform="translate(-15, 30)">
        <path d="M 0 30 Q -5 10 0 0" stroke="#7A9C74" stroke-width="2.2" fill="none"/>
        <circle cx="0" cy="0" r="8" fill="#D8E8F5"/>
        <circle cx="0" cy="0" r="3" fill="#9CBBD4"/>
      </g>
      <!-- Small Butterfly near flowers -->
      <g transform="translate(25, -25)">
        <ellipse cx="-4" cy="-3" rx="5" ry="8" transform="rotate(-25 -4 -3)" fill="#FDE8E4"/>
        <ellipse cx="4" cy="-3" rx="5" ry="8" transform="rotate(25 4 -3)" fill="#FDE8E4"/>
        <circle cx="0" cy="0" r="2" fill="#8C765C"/>
      </g>
    </g>
  </g>
</svg>
