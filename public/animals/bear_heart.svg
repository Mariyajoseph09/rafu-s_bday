<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250" width="100%" height="100%">
  <defs>
    <radialGradient id="bearFurHeart" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F2DEC9"/>
      <stop offset="65%" stop-color="#DBB892"/>
      <stop offset="100%" stop-color="#BD956A"/>
    </radialGradient>
    <radialGradient id="heartGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFB3B3"/>
      <stop offset="60%" stop-color="#E87A7A"/>
      <stop offset="100%" stop-color="#C44E4E"/>
    </radialGradient>
    <radialGradient id="snoutGrad3" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFF8EE"/>
      <stop offset="100%" stop-color="#EEDAC4"/>
    </radialGradient>
    <filter id="heartBearShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#4E3B27" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .bear-heart-anim {
      animation: heartPulseBear 3s ease-in-out infinite alternate;
      transform-origin: 120px 140px;
    }
    .big-heart {
      animation: heartBeating 1.5s ease-in-out infinite alternate;
      transform-origin: 120px 150px;
    }
    @keyframes heartPulseBear {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }
    @keyframes heartBeating {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }
  </style>

  <g class="bear-heart-anim" filter="url(#heartBearShadow)">
    <!-- Ears -->
    <circle cx="85" cy="55" r="15" fill="url(#bearFurHeart)"/>
    <circle cx="85" cy="55" r="8" fill="#F4DEC9"/>
    <circle cx="155" cy="55" r="15" fill="url(#bearFurHeart)"/>
    <circle cx="155" cy="55" r="8" fill="#F4DEC9"/>

    <!-- Feet -->
    <ellipse cx="80" cy="225" rx="18" ry="13" fill="url(#bearFurHeart)"/>
    <ellipse cx="80" cy="225" rx="10" ry="7" fill="#F4DEC9"/>
    <ellipse cx="160" cy="225" rx="18" ry="13" fill="url(#bearFurHeart)"/>
    <ellipse cx="160" cy="225" rx="10" ry="7" fill="#F4DEC9"/>

    <!-- Body -->
    <ellipse cx="120" cy="155" rx="42" ry="48" fill="url(#bearFurHeart)"/>

    <!-- Head -->
    <ellipse cx="120" cy="95" rx="42" ry="36" fill="url(#bearFurHeart)"/>

    <!-- Snout -->
    <ellipse cx="120" cy="104" rx="17" ry="13" fill="url(#snoutGrad3)"/>
    <ellipse cx="120" cy="99" rx="5" ry="3.5" fill="#423323"/>
    <path d="M 120 102.5 L 120 107" stroke="#423323" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 115 107 Q 120 112 125 107" fill="none" stroke="#423323" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Big Cheerful Eyes -->
    <circle cx="104" cy="90" r="3.8" fill="#2E241A"/>
    <circle cx="105.5" cy="88.5" r="1.3" fill="#FFFFFF"/>
    <circle cx="136" cy="90" r="3.8" fill="#2E241A"/>
    <circle cx="137.5" cy="88.5" r="1.3" fill="#FFFFFF"/>

    <!-- Blush -->
    <ellipse cx="94" cy="102" rx="6" ry="3.5" fill="#EFA094" opacity="0.55"/>
    <ellipse cx="146" cy="102" rx="6" ry="3.5" fill="#EFA094" opacity="0.55"/>

    <!-- Little Golden Crown on Head -->
    <polygon points="110,60 114,48 120,55 126,48 130,60" fill="#E8C782" stroke="#BF984B" stroke-width="1"/>
    <circle cx="114" cy="48" r="1.5" fill="#FFFFFF"/>
    <circle cx="120" cy="55" r="1.5" fill="#FFFFFF"/>
    <circle cx="126" cy="48" r="1.5" fill="#FFFFFF"/>

    <!-- ================= BIG CUSHION HEART ================= -->
    <g class="big-heart">
      <path d="M 120 120 C 120 102 96 90 82 104 C 68 118 80 142 120 172 C 160 142 172 118 158 104 C 144 90 120 102 120 120 Z" fill="url(#heartGrad)"/>
      <!-- Soft highlight on heart -->
      <path d="M 92 108 C 86 114 86 124 94 134" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    </g>

    <!-- Paws Wrapping Around the Heart -->
    <circle cx="82" cy="136" r="13" fill="url(#bearFurHeart)"/>
    <circle cx="82" cy="136" r="7" fill="#F4DEC9"/>
    <circle cx="158" cy="136" r="13" fill="url(#bearFurHeart)"/>
    <circle cx="158" cy="136" r="7" fill="#F4DEC9"/>
  </g>
</svg>
