<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%">
  <defs>
    <radialGradient id="bunnyWhite3" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F5F3EF"/>
      <stop offset="100%" stop-color="#E5E0D5"/>
    </radialGradient>
    <radialGradient id="bushGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C2D8BE"/>
      <stop offset="60%" stop-color="#91B38C"/>
      <stop offset="100%" stop-color="#678E62"/>
    </radialGradient>
    <filter id="peekShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3D4E3A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .peeking-bunny {
      animation: peekBob 3s ease-in-out infinite alternate;
      transform-origin: 100px 90px;
    }
    @keyframes peekBob {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <g filter="url(#peekShadow)">
    <!-- ================= PEEKING BUNNY ================= -->
    <g class="peeking-bunny">
      <!-- Ears -->
      <ellipse cx="85" cy="40" rx="7.5" ry="24" transform="rotate(-15 85 40)" fill="url(#bunnyWhite3)"/>
      <ellipse cx="85" cy="40" rx="4" ry="16" transform="rotate(-15 85 40)" fill="#FDE8E4"/>
      <ellipse cx="115" cy="40" rx="7.5" ry="24" transform="rotate(12 115 40)" fill="url(#bunnyWhite3)"/>
      <ellipse cx="115" cy="40" rx="4" ry="16" transform="rotate(12 115 40)" fill="#FDE8E4"/>

      <!-- Head -->
      <ellipse cx="100" cy="80" rx="30" ry="25" fill="url(#bunnyWhite3)"/>

      <!-- Eyes (Big curious dark eyes) -->
      <circle cx="89" cy="76" r="3.2" fill="#2E241A"/>
      <circle cx="90.2" cy="74.8" r="1.1" fill="#FFFFFF"/>
      <circle cx="111" cy="76" r="3.2" fill="#2E241A"/>
      <circle cx="112.2" cy="74.8" r="1.1" fill="#FFFFFF"/>

      <!-- Nose & Mouth -->
      <polygon points="100,84 97,81 103,81" fill="#E89B9B"/>
      <path d="M 100 84 L 100 88" stroke="#423323" stroke-width="1.2"/>
      <path d="M 97 88 Q 100 91 103 88" fill="none" stroke="#423323" stroke-width="1.2"/>

      <!-- Blush -->
      <ellipse cx="82" cy="83" rx="4.5" ry="2.5" fill="#EFA094" opacity="0.6"/>
      <ellipse cx="118" cy="83" rx="4.5" ry="2.5" fill="#EFA094" opacity="0.6"/>

      <!-- Little Paws Gripping the Bush -->
      <circle cx="82" cy="98" r="7" fill="url(#bunnyWhite3)"/>
      <circle cx="118" cy="98" r="7" fill="url(#bunnyWhite3)"/>
    </g>

    <!-- ================= PASTEL BUSH IN FRONT ================= -->
    <path d="M 30 150 C 15 150 10 130 25 115 C 30 100 55 95 70 105 C 80 88 115 88 130 105 C 145 95 170 100 175 115 C 190 130 185 150 170 150 Z" fill="url(#bushGrad)"/>
    
    <!-- Bush Flowers -->
    <g transform="translate(48, 120)">
      <circle cx="0" cy="0" r="4.5" fill="#FFF5EA"/>
      <circle cx="0" cy="0" r="2" fill="#E8C782"/>
    </g>
    <g transform="translate(145, 125)">
      <circle cx="0" cy="0" r="4.5" fill="#FFF5EA"/>
      <circle cx="0" cy="0" r="2" fill="#E8C782"/>
    </g>
    <g transform="translate(100, 132)">
      <circle cx="0" cy="0" r="5" fill="#FDE8E4"/>
      <circle cx="0" cy="0" r="2" fill="#E89B9B"/>
    </g>
  </g>
</svg>
