<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bunnyPair1" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F5F3EF"/>
      <stop offset="100%" stop-color="#E5E0D5"/>
    </radialGradient>
    <radialGradient id="bunnyPair2" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="70%" stop-color="#F7EFE4"/>
      <stop offset="100%" stop-color="#E2D4C2"/>
    </radialGradient>
    <filter id="pairShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#4E3B27" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .bunny-pair-anim {
      animation: cuddleBob 3.5s ease-in-out infinite alternate;
      transform-origin: 120px 140px;
    }
    @keyframes cuddleBob {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }
  </style>

  <g class="bunny-pair-anim" filter="url(#pairShadow)">
    <!-- ================= LEFT BUNNY ================= -->
    <g transform="translate(-10, 0)">
      <!-- Ears -->
      <ellipse cx="80" cy="45" rx="7" ry="24" transform="rotate(-15 80 45)" fill="url(#bunnyPair1)"/>
      <ellipse cx="80" cy="45" rx="4" ry="16" transform="rotate(-15 80 45)" fill="#FDE8E4"/>
      <ellipse cx="106" cy="45" rx="7" ry="24" transform="rotate(8 106 45)" fill="url(#bunnyPair1)"/>
      <ellipse cx="106" cy="45" rx="4" ry="16" transform="rotate(8 106 45)" fill="#FDE8E4"/>
      <!-- Body -->
      <ellipse cx="90" cy="135" rx="30" ry="35" fill="url(#bunnyPair1)"/>
      <ellipse cx="72" cy="168" rx="12" ry="8" fill="url(#bunnyPair1)"/>
      <!-- Head -->
      <ellipse cx="92" cy="94" rx="30" ry="25" fill="url(#bunnyPair1)"/>
      <!-- Face -->
      <circle cx="82" cy="90" r="3" fill="#2E241A"/>
      <circle cx="83" cy="89" r="1" fill="#FFFFFF"/>
      <circle cx="104" cy="90" r="3" fill="#2E241A"/>
      <circle cx="105" cy="89" r="1" fill="#FFFFFF"/>
      <polygon points="93,98 90,95 96,95" fill="#E89B9B"/>
      <!-- Blush -->
      <ellipse cx="76" cy="97" rx="4.5" ry="2.5" fill="#EFA094" opacity="0.6"/>
      <ellipse cx="108" cy="97" rx="4.5" ry="2.5" fill="#EFA094" opacity="0.6"/>
    </g>

    <!-- ================= RIGHT BUNNY (CUDDLED CLOSE) ================= -->
    <g transform="translate(15, 6)">
      <!-- Ears -->
      <ellipse cx="134" cy="42" rx="7" ry="24" transform="rotate(-8 134 42)" fill="url(#bunnyPair2)"/>
      <ellipse cx="134" cy="42" rx="4" ry="16" transform="rotate(-8 134 42)" fill="#FDE8E4"/>
      <ellipse cx="160" cy="44" rx="7" ry="24" transform="rotate(15 160 44)" fill="url(#bunnyPair2)"/>
      <ellipse cx="160" cy="44" rx="4" ry="16" transform="rotate(15 160 44)" fill="#FDE8E4"/>
      <!-- Body -->
      <ellipse cx="145" cy="135" rx="30" ry="35" fill="url(#bunnyPair2)"/>
      <ellipse cx="162" cy="168" rx="12" ry="8" fill="url(#bunnyPair2)"/>
      <!-- Head -->
      <ellipse cx="144" cy="94" rx="30" ry="25" fill="url(#bunnyPair2)"/>
      <!-- Face -->
      <circle cx="134" cy="90" r="3" fill="#2E241A"/>
      <circle cx="135" cy="89" r="1" fill="#FFFFFF"/>
      <circle cx="156" cy="90" r="3" fill="#2E241A"/>
      <circle cx="157" cy="89" r="1" fill="#FFFFFF"/>
      <polygon points="145,98 142,95 148,95" fill="#E89B9B"/>
      <!-- Blush -->
      <ellipse cx="128" cy="97" rx="4.5" ry="2.5" fill="#EFA094" opacity="0.6"/>
      <ellipse cx="160" cy="97" rx="4.5" ry="2.5" fill="#EFA094" opacity="0.6"/>
    </g>

    <!-- Soft Heart between them -->
    <g transform="translate(118, 70)">
      <path d="M 0 0 C 0 -6 -6 -10 -11 -6 C -16 -1 -12 7 0 16 C 12 7 16 -1 11 -6 C 6 -10 0 -6 0 0 Z" fill="#E89B9B"/>
    </g>
  </g>
</svg>
