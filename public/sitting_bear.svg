<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="sitBearFur" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#EEDAC2"/>
      <stop offset="65%" stop-color="#D7B48C"/>
      <stop offset="100%" stop-color="#B88F63"/>
    </radialGradient>
    <radialGradient id="sitSnout" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFF5E8"/>
      <stop offset="100%" stop-color="#EBD8C1"/>
    </radialGradient>
    <filter id="sitShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#4A3B2B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    .sit-wave-arm {
      animation: gentleWave 2.5s ease-in-out infinite alternate;
      transform-origin: 115px 95px;
    }
    .sit-head {
      animation: headTilt 4s ease-in-out infinite alternate;
      transform-origin: 80px 75px;
    }
    @keyframes gentleWave {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(-12deg); }
      100% { transform: rotate(4deg); }
    }
    @keyframes headTilt {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(3deg); }
    }
  </style>

  <g filter="url(#sitShadow)">
    <!-- Back Paws / Sitting Feet -->
    <!-- Left Foot Pad -->
    <ellipse cx="48" cy="128" rx="16" ry="12" fill="url(#sitBearFur)"/>
    <ellipse cx="48" cy="128" rx="10" ry="7" fill="#F4DEC9"/>
    <circle cx="43" cy="122" r="2.2" fill="#D7B48C"/>
    <circle cx="48" cy="120" r="2.2" fill="#D7B48C"/>
    <circle cx="53" cy="122" r="2.2" fill="#D7B48C"/>

    <!-- Right Foot Pad -->
    <ellipse cx="112" cy="128" rx="16" ry="12" fill="url(#sitBearFur)"/>
    <ellipse cx="112" cy="128" rx="10" ry="7" fill="#F4DEC9"/>
    <circle cx="107" cy="122" r="2.2" fill="#D7B48C"/>
    <circle cx="112" cy="120" r="2.2" fill="#D7B48C"/>
    <circle cx="117" cy="122" r="2.2" fill="#D7B48C"/>

    <!-- Teddy Body -->
    <ellipse cx="80" cy="104" rx="28" ry="30" fill="url(#sitBearFur)"/>
    <ellipse cx="80" cy="108" rx="17" ry="19" fill="url(#sitSnout)"/>

    <!-- Left Arm -->
    <ellipse cx="54" cy="98" rx="9" ry="14" transform="rotate(20 54 98)" fill="url(#sitBearFur)"/>

    <!-- Right Arm (Waving) -->
    <g class="sit-wave-arm">
      <ellipse cx="106" cy="95" rx="9" ry="15" transform="rotate(-30 106 95)" fill="url(#sitBearFur)"/>
      <circle cx="114" cy="85" r="7" fill="url(#sitBearFur)"/>
      <circle cx="114" cy="85" r="4" fill="#F4DEC9"/>
    </g>

    <!-- Head & Ears Group -->
    <g class="sit-head">
      <!-- Ears -->
      <circle cx="60" cy="46" r="13" fill="url(#sitBearFur)"/>
      <circle cx="60" cy="46" r="7" fill="#EBD2BA"/>

      <circle cx="100" cy="46" r="13" fill="url(#sitBearFur)"/>
      <circle cx="100" cy="46" r="7" fill="#EBD2BA"/>

      <!-- Head Base -->
      <ellipse cx="80" cy="65" rx="28" ry="24" fill="url(#sitBearFur)"/>

      <!-- Snout -->
      <ellipse cx="80" cy="72" rx="13" ry="10" fill="url(#sitSnout)"/>
      <ellipse cx="80" cy="68" rx="4" ry="2.8" fill="#423323"/>
      <path d="M 80 70.8 L 80 75" stroke="#423323" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 76 75 Q 80 79 84 75" fill="none" stroke="#423323" stroke-width="1.4" stroke-linecap="round"/>

      <!-- Eyes -->
      <circle cx="69" cy="61" r="3" fill="#2E241A"/>
      <circle cx="70" cy="60" r="1" fill="#FFFFFF"/>
      <circle cx="91" cy="61" r="3" fill="#2E241A"/>
      <circle cx="92" cy="60" r="1" fill="#FFFFFF"/>

      <!-- Blush -->
      <ellipse cx="63" cy="68" rx="4.5" ry="2.5" fill="#EFA094" opacity="0.45"/>
      <ellipse cx="97" cy="68" rx="4.5" ry="2.5" fill="#EFA094" opacity="0.45"/>

      <!-- Little Sage Bowtie -->
      <g transform="translate(80, 86)">
        <polygon points="0,0 -10,-5 -10,5" fill="#7E9178"/>
        <polygon points="0,0 10,-5 10,5" fill="#7E9178"/>
        <circle cx="0" cy="0" r="2.5" fill="#586953"/>
      </g>
    </g>
  </g>
</svg>

