<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bushG1" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D7EAD3"/>
      <stop offset="60%" stop-color="#A5C69F"/>
      <stop offset="100%" stop-color="#7A9E74"/>
    </radialGradient>
    <radialGradient id="mushRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFB3B3"/>
      <stop offset="65%" stop-color="#E87A7A"/>
      <stop offset="100%" stop-color="#C44E4E"/>
    </radialGradient>
  </defs>

  <!-- Left Bush -->
  <path d="M 20 90 C 5 90 0 70 12 55 C 20 40 45 35 60 48 C 75 32 105 32 120 48 C 135 40 155 50 155 70 C 160 85 150 90 140 90 Z" fill="url(#bushG1)"/>

  <!-- Right Bush -->
  <path d="M 160 90 C 145 90 140 70 152 55 C 160 40 185 35 200 48 C 215 32 245 32 260 48 C 275 40 295 50 295 70 C 300 85 290 90 280 90 Z" fill="url(#bushG1)"/>

  <!-- Flowers on Bushes -->
  <g transform="translate(45, 55)">
    <circle cx="0" cy="0" r="5" fill="#FDE8E4"/>
    <circle cx="0" cy="0" r="2" fill="#E89B9B"/>
  </g>
  <g transform="translate(100, 48)">
    <circle cx="0" cy="0" r="5.5" fill="#FFF2CE"/>
    <circle cx="0" cy="0" r="2.2" fill="#E8C782"/>
  </g>
  <g transform="translate(185, 50)">
    <circle cx="0" cy="0" r="5" fill="#D8E8F5"/>
    <circle cx="0" cy="0" r="2" fill="#9CBBD4"/>
  </g>
  <g transform="translate(240, 52)">
    <circle cx="0" cy="0" r="5" fill="#FDE8E4"/>
    <circle cx="0" cy="0" r="2" fill="#E89B9B"/>
  </g>

  <!-- Cute Little Red Nursery Mushroom in Middle -->
  <g transform="translate(150, 72)">
    <!-- Stem -->
    <path d="M -4 20 L -3 5 L 3 5 L 4 20 Z" fill="#FFFDF8"/>
    <!-- Cap -->
    <path d="M -12 6 C -12 -6 12 -6 12 6 Z" fill="url(#mushRed)"/>
    <!-- Dots -->
    <circle cx="-5" cy="0" r="1.5" fill="#FFFFFF"/>
    <circle cx="4" cy="-1" r="1.8" fill="#FFFFFF"/>
    <circle cx="0" cy="3" r="1.2" fill="#FFFFFF"/>
  </g>
</svg>

