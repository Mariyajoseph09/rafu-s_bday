<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 360" width="100%" height="100%">
  <defs>
    <radialGradient id="treeCrown1" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#D7EAD3"/>
      <stop offset="60%" stop-color="#A5C69F"/>
      <stop offset="100%" stop-color="#7A9E74"/>
    </radialGradient>
    <radialGradient id="treeCrown2" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E2F0DE"/>
      <stop offset="65%" stop-color="#B8D7B2"/>
      <stop offset="100%" stop-color="#8BB085"/>
    </radialGradient>
    <linearGradient id="treeTrunk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBB494"/>
      <stop offset="50%" stop-color="#BCA07D"/>
      <stop offset="100%" stop-color="#A58762"/>
    </linearGradient>
    <filter id="treeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4E3B27" flood-opacity="0.1"/>
    </filter>
  </defs>

  <style>
    .tree-sway {
      animation: treeGentleSway 5s ease-in-out infinite alternate;
      transform-origin: 100px 340px;
    }
    @keyframes treeGentleSway {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(1.2deg); }
    }
  </style>

  <g class="tree-sway" filter="url(#treeShadow)">
    <!-- Tree Trunk & Roots -->
    <path d="M 90 200 Q 85 270 70 340 L 130 340 Q 115 270 110 200 Z" fill="url(#treeTrunk)"/>
    <!-- Tree Branches -->
    <path d="M 94 220 Q 65 190 50 180 Q 70 185 96 205" fill="url(#treeTrunk)"/>
    <path d="M 106 210 Q 135 180 150 170 Q 130 180 104 195" fill="url(#treeTrunk)"/>

    <!-- Puffy Cloud-like Tree Foliage (Canopy) -->
    <!-- Back Layer -->
    <circle cx="70" cy="140" r="52" fill="url(#treeCrown1)"/>
    <circle cx="130" cy="140" r="52" fill="url(#treeCrown1)"/>
    <circle cx="100" cy="100" r="58" fill="url(#treeCrown1)"/>

    <!-- Front Highlight Canopy Puff -->
    <circle cx="100" cy="120" r="48" fill="url(#treeCrown2)"/>
    <circle cx="65" cy="150" r="38" fill="url(#treeCrown2)"/>
    <circle cx="135" cy="150" r="38" fill="url(#treeCrown2)"/>

    <!-- Small Pastel Blossom Flowers on Tree -->
    <g transform="translate(65, 110)">
      <circle cx="0" cy="0" r="5" fill="#FDE8E4"/>
      <circle cx="0" cy="0" r="2" fill="#E89B9B"/>
    </g>
    <g transform="translate(135, 115)">
      <circle cx="0" cy="0" r="5" fill="#FDE8E4"/>
      <circle cx="0" cy="0" r="2" fill="#E89B9B"/>
    </g>
    <g transform="translate(100, 75)">
      <circle cx="0" cy="0" r="6" fill="#FFF2CE"/>
      <circle cx="0" cy="0" r="2.5" fill="#E8C782"/>
    </g>
    <g transform="translate(110, 155)">
      <circle cx="0" cy="0" r="5" fill="#D8E8F5"/>
      <circle cx="0" cy="0" r="2" fill="#9CBBD4"/>
    </g>

    <!-- Little Bird on Branch -->
    <g transform="translate(52, 172)">
      <ellipse cx="0" cy="0" rx="7" ry="5" fill="#9CBBD4"/>
      <circle cx="5" cy="-2" r="3.5" fill="#9CBBD4"/>
      <polygon points="8,-2 12,-1 8,0" fill="#E8C782"/>
      <circle cx="5.5" cy="-2.5" r="0.8" fill="#2E241A"/>
    </g>
  </g>
</svg>

