<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 260" width="100%" height="100%">
  <defs>
    <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF8E0"/>
      <stop offset="60%" stop-color="#F7E298"/>
      <stop offset="100%" stop-color="#D6B863"/>
    </radialGradient>
    <radialGradient id="cloudSleep" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#EFF5FA"/>
      <stop offset="100%" stop-color="#D4E3F0"/>
    </radialGradient>
    <radialGradient id="bearFurSleep" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F2DEC9"/>
      <stop offset="65%" stop-color="#DBB892"/>
      <stop offset="100%" stop-color="#BD956A"/>
    </radialGradient>
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#E8C782" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .sleeping-scene {
      animation: gentleDrift 4.5s ease-in-out infinite alternate;
      transform-origin: 140px 140px;
    }
    .zzz-1 { animation: floatZzz 3s infinite ease-out; }
    .zzz-2 { animation: floatZzz 3s infinite ease-out 1s; }
    .zzz-3 { animation: floatZzz 3s infinite ease-out 2s; }
    @keyframes gentleDrift {
      0% { transform: translateY(0px) rotate(-1deg); }
      100% { transform: translateY(-8px) rotate(1.5deg); }
    }
    @keyframes floatZzz {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      40% { opacity: 0.9; }
      100% { transform: translate(14px, -24px) scale(1.1); opacity: 0; }
    }
  </style>

  <g class="sleeping-scene">
    <!-- ================= CRESCENT MOON WITH SLEEPING FACE ================= -->
    <g filter="url(#moonGlow)">
      <path d="M 95 30 C 160 30 200 80 190 145 C 185 180 155 210 115 225 C 175 205 190 140 165 85 C 150 50 120 35 95 30 Z" fill="url(#moonGrad)"/>
      <!-- Moon Sleeping Eye -->
      <path d="M 160 105 Q 166 112 172 105" fill="none" stroke="#6C5828" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Moon Gentle Smile -->
      <path d="M 165 125 Q 170 130 174 125" fill="none" stroke="#6C5828" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Moon Rosy Cheek -->
      <ellipse cx="170" cy="116" rx="5" ry="3.5" fill="#EFA094" opacity="0.6"/>
    </g>

    <!-- Hanging Tiny Star from Moon Tip -->
    <line x1="96" y1="32" x2="96" y2="52" stroke="#E8C782" stroke-width="1.4" stroke-dasharray="2,2"/>
    <text x="90" y="65" font-size="14" fill="#E8C782">★</text>

    <!-- ================= FLUFFY CLOUD CRIB ================= -->
    <path d="M 60 170 C 45 170 30 182 35 200 C 40 215 55 220 70 220 L 170 220 C 190 220 205 210 200 195 C 195 180 180 175 168 180 C 160 160 135 155 118 165 C 105 155 80 160 60 170 Z" fill="url(#cloudSleep)"/>
    <ellipse cx="90" cy="180" rx="30" ry="16" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="140" cy="178" rx="28" ry="16" fill="#FFFFFF" opacity="0.8"/>

    <!-- ================= SLEEPING BABY TEDDY BEAR ================= -->
    <g transform="translate(15, 2)">
      <!-- Bear Ear -->
      <circle cx="78" cy="148" r="11" fill="url(#bearFurSleep)"/>
      <circle cx="78" cy="148" r="6" fill="#F4DEC9"/>

      <!-- Bear Head (Resting on side) -->
      <ellipse cx="96" cy="162" rx="22" ry="18" fill="url(#bearFurSleep)"/>
      <ellipse cx="88" cy="166" rx="8" ry="6" fill="#FFF5EA"/>
      <circle cx="85" cy="164" r="2.2" fill="#423323"/>

      <!-- Closed Sleeping Eye -->
      <path d="M 95 158 Q 99 164 103 158" fill="none" stroke="#3D2F21" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="102" cy="166" rx="4" ry="2.5" fill="#EFA094" opacity="0.6"/>

      <!-- Nightcap on Bear -->
      <path d="M 100 148 C 112 142 122 135 130 125 C 126 138 116 150 106 155 Z" fill="#9CBBD4"/>
      <circle cx="132" cy="124" r="4.5" fill="#FFFFFF"/>
      <rect x="96" y="148" width="14" height="4" rx="2" fill="#FFFFFF"/>

      <!-- Soft Baby Quilt / Blanket Covering Body -->
      <path d="M 104 165 C 115 160 135 162 145 172 C 148 178 145 190 140 195 L 95 195 C 92 188 95 175 104 165 Z" fill="#EBC7B2"/>
      <ellipse cx="104" cy="168" rx="5" ry="5" fill="url(#bearFurSleep)"/> <!-- Tiny Paw Peeking over blanket -->

      <!-- Floating ZZZs -->
      <g fill="#9CBBD4" font-family="sans-serif" font-weight="bold">
        <text x="120" y="145" font-size="12" class="zzz-1">z</text>
        <text x="128" y="135" font-size="15" class="zzz-2">Z</text>
        <text x="138" y="122" font-size="18" class="zzz-3">Z</text>
      </g>
    </g>
  </g>
</svg>

