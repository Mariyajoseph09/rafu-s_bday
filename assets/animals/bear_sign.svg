<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="100%" height="100%">
  <defs>
    <radialGradient id="bearFurSign" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F2DEC9"/>
      <stop offset="65%" stop-color="#DBB892"/>
      <stop offset="100%" stop-color="#BD956A"/>
    </radialGradient>
    <radialGradient id="snoutGrad5" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFF8EE"/>
      <stop offset="100%" stop-color="#EEDAC4"/>
    </radialGradient>
    <linearGradient id="signWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F2E8D8"/>
    </linearGradient>
    <filter id="signShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#4E3B27" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .bear-sign-group {
      animation: signBob 3s ease-in-out infinite alternate;
      transform-origin: 130px 140px;
    }
    @keyframes signBob {
      0% { transform: translateY(0); }
      100% { transform: translateY(-3px); }
    }
  </style>

  <g class="bear-sign-group" filter="url(#signShadow)">
    <!-- Ears -->
    <circle cx="92" cy="52" r="14" fill="url(#bearFurSign)"/>
    <circle cx="92" cy="52" r="7" fill="#F4DEC9"/>
    <circle cx="168" cy="52" r="14" fill="url(#bearFurSign)"/>
    <circle cx="168" cy="52" r="7" fill="#F4DEC9"/>

    <!-- Feet -->
    <ellipse cx="90" cy="235" rx="18" ry="12" fill="url(#bearFurSign)"/>
    <ellipse cx="90" cy="235" rx="10" ry="7" fill="#F4DEC9"/>
    <ellipse cx="170" cy="235" rx="18" ry="12" fill="url(#bearFurSign)"/>
    <ellipse cx="170" cy="235" rx="10" ry="7" fill="#F4DEC9"/>

    <!-- Body -->
    <ellipse cx="130" cy="175" rx="42" ry="46" fill="url(#bearFurSign)"/>

    <!-- Head -->
    <ellipse cx="130" cy="90" rx="42" ry="36" fill="url(#bearFurSign)"/>

    <!-- Snout -->
    <ellipse cx="130" cy="99" rx="17" ry="13" fill="url(#snoutGrad5)"/>
    <ellipse cx="130" cy="94" rx="5" ry="3.5" fill="#423323"/>
    <path d="M 130 97.5 L 130 102" stroke="#423323" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 125 102 Q 130 108 135 102" fill="none" stroke="#423323" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Big Happy Eyes -->
    <circle cx="114" cy="85" r="3.8" fill="#2E241A"/>
    <circle cx="115.5" cy="83.5" r="1.3" fill="#FFFFFF"/>
    <circle cx="146" cy="85" r="3.8" fill="#2E241A"/>
    <circle cx="147.5" cy="83.5" r="1.3" fill="#FFFFFF"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="104" cy="97" rx="6" ry="3.5" fill="#EFA094" opacity="0.55"/>
    <ellipse cx="156" cy="97" rx="6" ry="3.5" fill="#EFA094" opacity="0.55"/>

    <!-- Little Sage Green Party Hat -->
    <polygon points="130,28 118,58 142,58" fill="#8F9E89"/>
    <circle cx="130" cy="26" r="3" fill="#E8C782"/>
    <line x1="122" y1="46" x2="138" y2="46" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="125" y1="38" x2="135" y2="38" stroke="#FFFFFF" stroke-width="2"/>

    <!-- ================= WELCOME SIGN BOARD ================= -->
    <g transform="translate(20, 125)">
      <!-- Sign Board -->
      <rect x="0" y="0" width="220" height="72" rx="14" fill="url(#signWood)" stroke="#D4C2A8" stroke-width="2"/>
      <rect x="4" y="4" width="212" height="64" rx="10" fill="none" stroke="#D4C2A8" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- Sign Text -->
      <text x="110" y="24" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#8F9E89" text-anchor="middle">YOU ARE WARMLY INVITED</text>
      <text x="110" y="46" font-family="'Alex Brush', cursive" font-size="25" fill="#3D4439" text-anchor="middle">Please RSVP for Rafu!</text>
      <text x="110" y="62" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="600" letter-spacing="1" fill="#BC9E76" text-anchor="middle">♡ CAN'T WAIT TO CELEBRATE ♡</text>
    </g>

    <!-- Paws Gripping the Sign -->
    <circle cx="45" cy="145" r="11" fill="url(#bearFurSign)"/>
    <circle cx="45" cy="145" r="6" fill="#F4DEC9"/>
    <circle cx="215" cy="145" r="11" fill="url(#bearFurSign)"/>
    <circle cx="215" cy="145" r="6" fill="#F4DEC9"/>
  </g>
</svg>

